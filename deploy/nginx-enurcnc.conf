server {
    listen 80;
    listen [::]:80;
    server_name enurcnc.com www.enurcnc.com;

    client_max_body_size 64M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://www.enurcnc.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.enurcnc.com;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 64M;

    ssl_certificate /etc/letsencrypt/live/enurcnc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enurcnc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/dsm/([a-zA-Z0-9\-_]+)\.html$ /dsm/$1.php last;
        rewrite ^/([a-zA-Z0-9\-_]+)\.html$ /$1.php last;
        rewrite ^/urun/([a-zA-Z0-9\-_]+)?$ /urun-detay.php?seo=$1 last;
        rewrite ^/hizmetler$ /kullanim-alanlari.php last;
        rewrite ^/hizmet/([a-zA-Z0-9\-_]+)?$ /kullanim-alani.php?seo=$1 last;
        rewrite ^/sektorler$ /medya-basin.php last;
        rewrite ^/sektor/([a-zA-Z0-9\-_]+)?$ /medya-detay.php?seo=$1 last;
        rewrite ^/iletisim$ /iletisim.php last;
        rewrite ^/hata-([a-zA-Z0-9\-_]+)?$ /error.php?seo=$1 last;
        rewrite ^/urunler$ /kategori.php?seo=urunler last;
        rewrite ^/urunler/([a-zA-Z0-9\-_]+)?$ /kategori.php?seo=$1 last;
        rewrite ^/sitemap\.xml$ /sitemap.php last;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
    }

    error_page 404 /404.php;
}
